<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Moon Orbit</title>
    <!-- <link rel="stylesheet" href="./styles.css" /> -->
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
        }

        .space {
            width: 200px;
            height: 200px;
            position: relative;
        }

        .earth {
            width: 100px;
            height: 100px;
            position: absolute;
            top: 50%;
            left: 50%;
            background-color: blue;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        .orbit {
            width: 200px;
            height: 200px;
            position: absolute;
            transform: translate(-50%, -50%);
            animation: orbit 5s linear infinite;
        }

        .moon {
            width: 30px;
            height: 30px;
            background-color: #aaa;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, 0);
            border-radius: 50%;
        }

        @keyframes orbit {
            0% {
                transform: rotate(0deg) translate(-50%, -50%);
            }

            100% {
                transform: rotate(360deg) translate(-50%, -50%);
            }
        }
    </style>
</head>

<body>
    <div class="space">
        <div class="earth"></div>
        <div class="orbit">
            <div class="moon"></div>
        </div>
    </div>
</body>

</html>
